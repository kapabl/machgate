name: External Mach-O CLI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: external-macho-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-arm64:
    name: Extended ARM64 Mach-O CLI gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Apple-ABI libc++ source
        run: git submodule update --init --depth 1 extern/llvm-project

      - name: Restore external artifact cache
        uses: actions/cache@v4
        with:
          path: .cache/machgate-external
          key: external-arm64-57-v1

      - name: Build ARM64 toolchain image
        run: |
          docker build \
            -t machgate-arm64-toolchain \
            -f .github/docker/arm64-toolchain.Dockerfile \
            .

      - name: Run external Mach-O probes
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            machgate-arm64-toolchain \
            bash -lc '
              set -euo pipefail
              cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Debug
              cmake --build build-arm64 --verbose -j1
              MACHGATE_SHIM_LIB=/work/build-arm64/libsystem_shim.so \
                scripts/build-libcxx.sh
              MACHGATE_RUN_EXTERNAL=1 \
                MACHGATE_SYSTEM_SHIM_LIB=/work/build-arm64/libsystem_shim.so \
                BUILD_DIR=/work/build-arm64 \
                MACHGATE_EXTERNAL_MANIFEST=/work/tests/external/extended_arm64_macho_cli_manifest.txt \
                MACHGATE_EXTERNAL_CACHE=/work/.cache/machgate-external \
                MACHGATE_EXTERNAL_TIMEOUT=120 \
                MACHGATE_EXTERNAL_REQUIRE_LIBCXX=1 \
                MACHGATE_EXTERNAL_LIBCXX=/work/build-libcxx/lib/libc++.so.1 \
                bash tests/test_external_macho_cli.sh
            '

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-macho-diagnostics
          path: tests/external/logs/
          if-no-files-found: ignore
