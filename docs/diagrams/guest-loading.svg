<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="30" y="50" font-size="28" font-weight="700" fill="#0f172a">From Mach-O file to running guest</text>
  <text x="30" y="80" font-size="16" fill="#475569">Image Preparation — five ordered steps, all before the first guest instruction runs</text>

  <!-- step 1 -->
  <rect x="24" y="150" width="204" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="126" cy="192" r="19" fill="#3b82f6"/>
  <text x="126" y="199" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="126" y="244" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Select &amp; validate</text>
  <text font-size="14" fill="#334155" text-anchor="middle">
    <tspan x="126" y="278">thin file, or ARM64 slice</tspan>
    <tspan x="126" y="302">of a fat file</tspan>
    <tspan x="126" y="338" fill="#b91c1c">reject ⇒ nothing mapped</tspan>
  </text>

  <!-- step 2 -->
  <rect x="260" y="150" width="204" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="362" cy="192" r="19" fill="#3b82f6"/>
  <text x="362" y="199" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="362" y="244" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Map segments</text>
  <text font-size="14" fill="#334155" text-anchor="middle">
    <tspan x="362" y="278">__TEXT / __DATA at the</tspan>
    <tspan x="362" y="302">requested addresses</tspan>
    <tspan x="362" y="326">slide + r-x / rw- protections</tspan>
  </text>

  <!-- step 3 -->
  <rect x="496" y="150" width="204" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="598" cy="192" r="19" fill="#3b82f6"/>
  <text x="598" y="199" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="598" y="244" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Entry point</text>
  <text font-size="14" fill="#334155" text-anchor="middle">
    <tspan x="598" y="278">LC_MAIN or a supported</tspan>
    <tspan x="598" y="302">LC_UNIXTHREAD —</tspan>
    <tspan x="598" y="326">one validated address</tspan>
  </text>

  <!-- step 4 -->
  <rect x="732" y="150" width="204" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="834" cy="192" r="19" fill="#3b82f6"/>
  <text x="834" y="199" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="834" y="244" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Guarded stack</text>
  <text font-size="14" fill="#334155" text-anchor="middle">
    <tspan x="834" y="278">main stack with guard</tspan>
    <tspan x="834" y="302">pages; guest args and</tspan>
    <tspan x="834" y="326">environment laid out</tspan>
  </text>

  <!-- step 5 -->
  <rect x="968" y="150" width="204" height="240" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="1070" cy="192" r="19" fill="#059669"/>
  <text x="1070" y="199" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1070" y="244" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Guest Image</text>
  <text font-size="14" fill="#334155" text-anchor="middle">
    <tspan x="1070" y="278">validated aggregate →</tspan>
    <tspan x="1070" y="302">static initializers,</tspan>
    <tspan x="1070" y="326">then guest entry</tspan>
  </text>

  <line x1="230" y1="270" x2="256" y2="270" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="466" y1="270" x2="492" y2="270" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="702" y1="270" x2="728" y2="270" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="938" y1="270" x2="964" y2="270" stroke="#334155" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- invariant -->
  <rect x="24" y="460" width="1152" height="84" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="496" font-size="16" font-weight="600" fill="#78350f" text-anchor="middle">All-or-nothing: a Guest Image exists only after the whole file is validated and mapped.</text>
  <text x="600" y="524" font-size="16" fill="#78350f" text-anchor="middle">Any failure leaves nothing behind — no partial image, no half-prepared guest.</text>

  <!-- load commands -->
  <rect x="24" y="580" width="1152" height="56" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="600" y="614" font-size="14" fill="#475569" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">LC_SEGMENT_64 · LC_MAIN · LC_UNIXTHREAD · LC_LOAD_DYLIB · LC_DYLD_INFO — every range validated before use</text>
</svg>
