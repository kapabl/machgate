<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="30" y="50" font-size="28" font-weight="700" fill="#0f172a">Patching: svc #0x80 never reaches the kernel</text>
  <text x="30" y="80" font-size="16" fill="#475569">Before the guest runs, MachGate rewrites every Darwin syscall site found in executable sections</text>

  <!-- BEFORE -->
  <rect x="40" y="130" width="500" height="240" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="164" font-size="16" font-weight="700" fill="#475569">BEFORE — as the linker produced it</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#0f172a">
    <text x="60" y="206">mov x16, #SYS_write</text>
    <text x="60" y="238">mov x0, …arguments…</text>
  </g>
  <rect x="56" y="256" width="466" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="66" y="279" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#92400e">svc #0x80</text>
  <text x="200" y="279" font-size="14" fill="#b45309">← traps; Linux would reject it</text>
  <text x="60" y="326" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#0f172a">…guest continues at N+4</text>

  <!-- rewrite arrow -->
  <line x1="550" y1="250" x2="650" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arw)"/>
  <text x="600" y="230" font-size="14.5" font-weight="600" fill="#334155" text-anchor="middle">MachGate rewrites</text>
  <text x="600" y="278" font-size="13.5" fill="#64748b" text-anchor="middle">once, at load time</text>

  <!-- AFTER -->
  <rect x="660" y="130" width="500" height="240" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="680" y="164" font-size="16" font-weight="700" fill="#065f46">AFTER — what actually runs</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#0f172a">
    <text x="680" y="206">mov x16, #SYS_write</text>
    <text x="680" y="238">mov x0, …arguments…</text>
  </g>
  <rect x="676" y="256" width="466" height="34" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="686" y="279" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#065f46">b island_47</text>
  <text x="820" y="279" font-size="14" fill="#047857">← direct branch into MachGate</text>
  <text x="680" y="326" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#0f172a">…guest continues at N+4</text>

  <!-- island card -->
  <line x1="910" y1="372" x2="910" y2="424" stroke="#059669" stroke-width="2.5" marker-end="url(#arwg)"/>
  <text x="922" y="402" font-size="13.5" fill="#047857">branch taken</text>

  <rect x="660" y="430" width="500" height="170" rx="12" fill="#f0fdf4" stroke="#059669"/>
  <text x="680" y="462" font-size="16" font-weight="700" fill="#065f46">island_47 — generated ARM64 code</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#064e3b">
    <text x="680" y="496">save x0..x18, x30, NZCV · resume = N+4</text>
    <text x="680" y="528">blr syscall_gate_dispatch</text>
    <text x="680" y="560">restore registers · x0 = Darwin result</text>
    <text x="680" y="590">br resume</text>
  </g>
  <path d="M 656 515 C 570 505, 560 420, 645 376" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arwg)"/>
  <text x="545" y="450" font-size="13.5" font-weight="600" fill="#047857" text-anchor="end">guest resumes</text>

  <!-- footer -->
  <rect x="40" y="618" width="1120" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="645" font-size="14" fill="#334155" text-anchor="middle">b, not bl — guest x30 untouched · patch sites = aligned svc in executable sections only · every island within direct-branch reach (±128 MiB)</text>
</svg>
